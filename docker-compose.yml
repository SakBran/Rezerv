services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rezerv
      MYSQL_USER: rezerv
      MYSQL_PASSWORD: rezerv
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
    volumes: [mysql-data:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  mysql-data: